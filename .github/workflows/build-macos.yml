name: Build MohiView for macOS

# Builds RustDesk at RUSTDESK_VERSION with the shared branding (patches/, overlay/)
# plus the macOS extras (mac/). Steps follow upstream's flutter-build.yml macOS job.
# Not code-signed by Apple: the app is ad-hoc signed and installed with mac/install.sh
# (curl leaves no quarantine flag, so Gatekeeper does not block it).
on:
  push:
    branches: [main]
    paths:
      - "mac/**"
      - "patches/**"
      - "overlay/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the DMGs to the GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTDESK_VERSION: "1.5.1"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear"

jobs:
  bridge:
    name: Generate Flutter-Rust bridge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mohiview

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.RUSTDESK_VERSION }}
          submodules: recursive
          path: rustdesk

      - name: Apply MohiView branding
        run: python3 mohiview/patches/apply_branding.py rustdesk mohiview

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge
          workspaces: rustdesk

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install the bridge generator
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' rustdesk/flutter/pubspec.yaml
          cd rustdesk/flutter && flutter pub get

      - name: Generate the bridge
        working-directory: rustdesk
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-macos
          if-no-files-found: error
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart
            rustdesk/flutter/macos/Runner/bridge_generated.h

  macos:
    name: Build macOS ${{ matrix.job.arch }}
    needs: bridge
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: arm64, target: aarch64-apple-darwin, os: macos-14, extra-build-args: "--screencapturekit" }
          - { arch: x64, target: x86_64-apple-darwin, os: macos-15-intel, extra-build-args: "" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mohiview

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.RUSTDESK_VERSION }}
          submodules: recursive
          path: rustdesk

      - name: Apply MohiView branding
        run: |
          python3 mohiview/patches/apply_branding.py rustdesk mohiview
          python3 mohiview/mac/apply_branding_macos.py rustdesk mohiview
          iconutil -c icns mohiview/mac/MohiView.iconset -o rustdesk/flutter/macos/Runner/AppIcon.icns

      - name: Install build tools
        run: |
          brew install llvm create-dmg
          command -v pkg-config >/dev/null || brew install pkg-config

      # NASM 2.x on purpose (upstream: NASM 3 breaks aom and friends).
      - name: Install NASM 2.16
        run: |
          curl -fsSLO https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch Flutter
        run: |
          FLUTTER_DIR="$(dirname "$(dirname "$(which flutter)")")"
          cd "$FLUTTER_DIR"
          git apply "$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          # https://github.com/flutter/flutter/issues/133533 (same workaround as upstream)
          perl -pi -e 's{_setFramesEnabledState\(false\);}{//_setFramesEnabledState(false);}g' packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' packages/flutter/lib/src/scheduler/binding.dart

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}
          workspaces: rustdesk

      - name: Restore the bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-macos
          path: rustdesk

      # vcpkg is not preinstalled on the Mac runners: clone it first, then restore installed/ into it.
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.os }}-${{ hashFiles('rustdesk/vcpkg.json') }}

      - name: Install vcpkg dependencies
        working-directory: rustdesk
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg/installed
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ matrix.job.os }}-${{ hashFiles('rustdesk/vcpkg.json') }}

      - name: Build MohiView
        working-directory: rustdesk
        run: |
          if [ "${{ matrix.job.arch }}" = "arm64" ]; then
            # ScreenCaptureKit needs macOS 12.3+, as in upstream.
            MIN=12.3
            perl -pi -e "s/MACOSX_DEPLOYMENT_TARGET=[0-9]+\.[0-9]+/MACOSX_DEPLOYMENT_TARGET=$MIN/" build.py
            perl -pi -e "s/platform :osx, '.*'/platform :osx, '$MIN'/" flutter/macos/Podfile
            perl -pi -e "s/osx_minimum_system_version = \"[0-9]+\.[0-9]+\"/osx_minimum_system_version = \"$MIN\"/" Cargo.toml
            perl -pi -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]+\.[0-9]+;/MACOSX_DEPLOYMENT_TARGET = $MIN;/" flutter/macos/Runner.xcodeproj/project.pbxproj
            export MACOSX_DEPLOYMENT_TARGET=$MIN
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Sign (ad-hoc) and check the app is really MohiView
        working-directory: rustdesk
        run: |
          APP=flutter/build/macos/Build/Products/Release/MohiView.app
          test -d "$APP" || { echo "MohiView.app was not built"; ls flutter/build/macos/Build/Products/Release; exit 1; }
          xattr -cr "$APP" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.brandivolabs.mohiview"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$APP/Contents/Info.plist")" = "MohiView"
          test -f "$APP/Contents/MacOS/service"
          v="$("$APP/Contents/MacOS/MohiView" --version)"
          echo "MohiView --version: $v"
          test "$v" = "$RUSTDESK_VERSION"
          for s in remote.brandivolabs.com 6SnjPxxIqKEigkVh5oyLOdybN985sLKctewuicFufxg=; do
            grep -rlF "$s" "$APP/Contents" >/dev/null || { echo "missing '$s' in the app"; exit 1; }
          done
          if grep -rlF "rs-ny.rustdesk.com" "$APP/Contents" >/dev/null; then echo "public RustDesk server still built in"; exit 1; fi
          echo "Branding verified."

      - name: Make the DMG
        run: |
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          perl -pi -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          mkdir -p out
          DMG="MohiView-mac-${{ matrix.job.arch }}.dmg"
          create-dmg --volname "MohiView" --window-size 800 400 --icon-size 100 \
            --icon "MohiView.app" 200 190 --hide-extension "MohiView.app" --app-drop-link 600 185 \
            "out/$DMG" rustdesk/flutter/build/macos/Build/Products/Release/MohiView.app
          cd out && shasum -a 256 "$DMG" > "SHA256SUMS-mac-${{ matrix.job.arch }}.txt" && cat SHA256SUMS-*.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MohiView-${{ env.RUSTDESK_VERSION }}-mac-${{ matrix.job.arch }}
          path: out/*
          if-no-files-found: error

      - name: Publish to the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${RUSTDESK_VERSION}"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "MohiView ${RUSTDESK_VERSION}" \
              --notes "MohiView ${RUSTDESK_VERSION}, built from RustDesk ${RUSTDESK_VERSION} with the branding in this repository. Server remote.brandivolabs.com is built in. Not code-signed." || true
          fi
          gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
