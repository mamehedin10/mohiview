name: Build MohiView for Windows

# Builds RustDesk at RUSTDESK_VERSION with this repo's branding (patches/ + overlay/).
# The steps follow upstream's .github/workflows/flutter-build.yml (windows x64 job)
# and use the same pinned actions and tool versions.
on:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "overlay/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the installer as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTDESK_VERSION: "1.5.1"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear"
  VCPKG_TRIPLET: "x64-windows-static"

jobs:
  bridge:
    name: Generate Flutter-Rust bridge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mohiview

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.RUSTDESK_VERSION }}
          submodules: recursive
          path: rustdesk

      - name: Apply MohiView branding
        run: python3 mohiview/patches/apply_branding.py rustdesk mohiview

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge
          workspaces: rustdesk

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install the bridge generator
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3 needs extended_text 13 to resolve, as in upstream bridge.yml.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' rustdesk/flutter/pubspec.yaml
          cd rustdesk/flutter && flutter pub get

      - name: Generate the bridge
        working-directory: rustdesk
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge
          if-no-files-found: error
          path: |
            rustdesk/src/bridge_generated.rs
            rustdesk/src/bridge_generated.io.rs
            rustdesk/flutter/lib/generated_bridge.dart
            rustdesk/flutter/lib/generated_bridge.freezed.dart

  windows:
    name: Build Windows x64
    needs: bridge
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: mohiview

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.RUSTDESK_VERSION }}
          submodules: recursive
          path: rustdesk

      - name: Apply MohiView branding
        run: python mohiview/patches/apply_branding.py rustdesk mohiview

      - name: Restore the bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge
          path: rustdesk

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685 - same engine swap as upstream.
      - name: Use RustDesk's patched Flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch Flutter
        shell: bash
        run: |
          FLUTTER_DIR=$(dirname "$(dirname "$(which flutter)")")
          cp rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$FLUTTER_DIR"
          cd "$FLUTTER_DIR" && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows
          workspaces: rustdesk

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('rustdesk/vcpkg.json') }}

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Install vcpkg dependencies
        working-directory: rustdesk
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet $VCPKG_TRIPLET --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-${{ env.VCPKG_TRIPLET }}-${{ hashFiles('rustdesk/vcpkg.json') }}

      - name: Build MohiView
        working-directory: rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Virtual display driver, as in the upstream build.
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          Rename-Item ./rustdesk/rustdesk.exe MohiView.exe

      - name: Check the build is really MohiView
        working-directory: rustdesk
        run: |
          $v = (& ./rustdesk/MohiView.exe --version | Out-String).Trim()
          Write-Host "MohiView.exe --version: $v"
          if ($v -ne $env:RUSTDESK_VERSION) { throw "unexpected version '$v'" }
          foreach ($a in 'icon.svg', 'icon.png', 'icon.ico', 'logo_light.png', 'logo_dark.png') {
            if (-not (Test-Path "./rustdesk/data/flutter_assets/assets/$a")) { throw "missing flutter asset $a" }
          }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("$PWD/rustdesk/librustdesk.dll"))
          foreach ($s in 'remote.brandivolabs.com', '6SnjPxxIqKEigkVh5oyLOdybN985sLKctewuicFufxg=', 'MohiView') {
            if (-not $text.Contains($s)) { throw "librustdesk.dll does not contain '$s'" }
          }
          if ($text.Contains('rs-ny.rustdesk.com')) { throw 'the public RustDesk server is still built in' }
          Write-Host 'Branding verified: name, server, key and logos are in the build.'

      - name: Pack the installer
        working-directory: rustdesk
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; fi
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/MohiView.exe
          popd
          mkdir -p ../out
          mv ./target/release/rustdesk-portable-packer.exe "../out/MohiView-${RUSTDESK_VERSION}-x64.exe"
          cd ../out && sha256sum ./*.exe | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MohiView-${{ env.RUSTDESK_VERSION }}-windows-x64
          path: out/*
          if-no-files-found: error

      - name: Publish the release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${RUSTDESK_VERSION}"
          FILES="out/MohiView-${RUSTDESK_VERSION}-x64.exe out/SHA256SUMS.txt"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $FILES -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "MohiView ${RUSTDESK_VERSION}" \
              --notes "MohiView for Windows 64-bit, built from RustDesk ${RUSTDESK_VERSION} with the branding in this repository. Server remote.brandivolabs.com is built in. Not code-signed."
          fi
